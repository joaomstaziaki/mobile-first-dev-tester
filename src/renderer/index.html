<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- 'unsafe-inline' for styles: Electron's <webview> sizes its internal
       frame with an injected inline style, which a stricter policy blocks. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Mobile-First Dev Tester</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="topbar">
    <input id="url" type="text" placeholder="localhost:3000  ·  staging.example.com  ·  any URL" spellcheck="false">
    <button id="load">Load</button>
    <button id="reload" title="Reload the frame (after you save your code)">Reload</button>
    <button id="clear" title="Unload the frame and forget the saved URL">Clear</button>
    <div class="hint">
      Enter loads. The frame is a real browser viewport at the width shown — your media queries evaluate
      there exactly as on the device — with an iPhone user agent and 3× pixel ratio, so sites serve their
      mobile versions. Edit the size boxes to test another device size.
    </div>
  </header>

  <main id="frames">
    <div class="frame" data-device="iPhone 13" data-screen="390" data-h="844"></div>
  </main>

  <div id="authmodal" hidden>
    <form id="authform">
      <h2>Sign in</h2>
      <p id="authwhere"></p>
      <label>Username <input id="authuser" type="text" autocomplete="off" spellcheck="false"></label>
      <label>Password <input id="authpass" type="password" autocomplete="off"></label>
      <div class="row">
        <button type="button" id="authcancel">Cancel</button>
        <button type="submit" id="authok">Sign in</button>
      </div>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
