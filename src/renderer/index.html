<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- 'unsafe-inline' for styles: Electron's <webview> sizes its internal
       frame with an injected inline style, which a stricter policy blocks. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Mobile-First Dev Tester</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="topbar">
    <input id="url" type="text" placeholder="localhost:3000  ·  staging.example.com  ·  any URL" spellcheck="false">
    <button id="load">Load</button>
    <button id="reload" title="Reload the frame (after you save your code)">Reload</button>
    <button id="clear" title="Unload every frame and forget the saved URL">Clear</button>
    <select id="adddev" title="Add another device frame"></select>
    <label class="tog" title="Scroll one frame and the others follow (proportionally)">
      <input type="checkbox" id="syncscroll"> Sync scroll</label>
    <label class="tog" title="Clicks and navigation are mirrored to the other frames">
      <input type="checkbox" id="syncclicks"> Sync clicks</label>
    <label class="tog" title="Mouse input becomes touch events in phone and tablet frames, like DevTools device mode">
      <input type="checkbox" id="touchtog"> Touch</label>
    <select id="net" title="Network throttling, applied to every frame">
      <option value="online">Online</option>
      <option value="fast3g">Fast 3G</option>
      <option value="slow3g">Slow 3G</option>
      <option value="offline">Offline</option>
    </select>
    <select id="zoom" title="Zoom the rail; Fit scales it to the window (viewports stay honest — it is only visual)">
      <option value="fit">Fit</option>
      <option value="1">100%</option>
      <option value="0.75">75%</option>
      <option value="0.5">50%</option>
    </select>
    <div class="hint">
      Enter loads every frame. Each frame is a real browser viewport at the width shown — your media
      queries evaluate there exactly as on the device — with that device's user agent and pixel ratio,
      so sites serve their mobile versions. Edit the size boxes for a custom size, ⟳ rotates, × removes.
    </div>
  </header>

  <main id="frames"><div id="railscale"></div></main>

  <div id="authmodal" hidden>
    <form id="authform">
      <h2>Sign in</h2>
      <p id="authwhere"></p>
      <label>Username <input id="authuser" type="text" autocomplete="off" spellcheck="false"></label>
      <label>Password <input id="authpass" type="password" autocomplete="off"></label>
      <div class="row">
        <button type="button" id="authcancel">Cancel</button>
        <button type="submit" id="authok">Sign in</button>
      </div>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
